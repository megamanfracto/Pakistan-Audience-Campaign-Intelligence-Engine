<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Audience &amp; Campaign Intelligence Engine</title>
<style>
:root{--bg:#fff;--fg:#1c1b1a;--mut:#6b6862;--card:#f4f2ee;--acc:#0f766e;--bar:#14b8a6;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161514;--fg:#ece9e4;--mut:#a29d95;--card:#22201e;--acc:#5eead4;--bar:#14b8a6;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#161514;--fg:#ece9e4;--mut:#a29d95;--card:#22201e;--acc:#5eead4;--bar:#14b8a6;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:13px}
.note{background:var(--card);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin:12px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg)}
nav button{flex:none;border:1px solid var(--mut);background:none;color:var(--fg);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
nav button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar{height:14px;background:var(--bar);border-radius:3px}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--acc);color:var(--bg);margin-right:4px}
.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}td,th{padding:5px 8px;text-align:right;border-bottom:1px solid var(--card)}td:first-child,th:first-child{text-align:left}
li{margin:8px 0}q{color:var(--mut)}
</style></head><body><main>
<h1>Pakistan Audience &amp; Campaign Intelligence Engine</h1>
<div class="sub" id="meta"></div>
<div class="note"><b>Simulated demo data.</b> These numbers come from generated posts and comments that follow the project’s Table A / Table B schema, not from real brand accounts. Swap in real data with the same columns to get real findings.</div>
<nav id="nav"></nav><section id="out"></section></main>
<script>
const D={"n_posts": 2400, "n_comments": 13146, "langs": {"Roman Urdu": 6045, "English": 3791, "Urdu": 3310}, "content": [{"content_type": "Eid campaign", "posts": 391, "median_eng": 1696.0, "avg_comments": 201.0}, {"content_type": "Influencer post", "posts": 388, "median_eng": 1495.0, "avg_comments": 176.0}, {"content_type": "Reel", "posts": 401, "median_eng": 1239.0, "avg_comments": 152.0}, {"content_type": "Styling video", "posts": 402, "median_eng": 1132.0, "avg_comments": 128.0}, {"content_type": "Sale announcement", "posts": 406, "median_eng": 885.0, "avg_comments": 110.0}, {"content_type": "Product photo", "posts": 412, "median_eng": 792.0, "avg_comments": 105.0}], "matrix": [{"content_type": "Eid campaign", "Facebook": 1058.0, "Instagram": 1770.0, "TikTok": 2817.0}, {"content_type": "Influencer post", "Facebook": 988.0, "Instagram": 1470.0, "TikTok": 2389.0}, {"content_type": "Reel", "Facebook": 937.0, "Instagram": 1140.0, "TikTok": 2188.0}, {"content_type": "Styling video", "Facebook": 745.0, "Instagram": 994.0, "TikTok": 1776.0}, {"content_type": "Sale announcement", "Facebook": 588.0, "Instagram": 884.0, "TikTok": 1472.0}, {"content_type": "Product photo", "Facebook": 478.0, "Instagram": 785.0, "TikTok": 1428.0}], "campaigns": {"Eid Collection": 1204.0, "Summer Lawn": 1193.0, "11.11 Sale": 1182.0, "12.12 Sale": 1132.0}, "topics": {"price": 20.7, "discount": 17.8, "praise": 15.7, "availability": 11.2, "delivery": 9.8, "purchase_intent": 9.0, "fabric": 8.9, "sizing": 7.0}, "segments": [{"id": 7, "share": 6.7, "terms": ["قیمت", "ہے", "کیا"], "topic": "price", "purity": 76, "sentiment": {"neutral": 100}, "samples": ["سائز کتنا ہے؟ plz", "قیمت کیا ہے؟??", "قیمت کیا ہے؟ plz"]}, {"id": 5, "share": 5.2, "terms": ["zyada", "bohat", "price"], "topic": "price", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Price bohat zyada hai.", "Price bohat zyada hai. plz", "Price bohat zyada hai. 😍"]}, {"id": 6, "share": 5.2, "terms": ["rate", "suit", "گی"], "topic": "price", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Rate kya hai is suit ka? plz", "Rate kya hai is suit ka???", "Rate kya hai is suit ka? pls reply"]}, {"id": 10, "share": 5.2, "terms": ["please", "price", "گی"], "topic": "price", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Price please? plz", "Price please? 😍", "Price please???"]}, {"id": 12, "share": 4.7, "terms": ["آرڈر", "نہیں", "ابھی"], "topic": "delivery", "purity": 53, "sentiment": {"negative": 53, "positive": 47}, "samples": ["آرڈر ابھی تک نہیں پہنچا 😍", "آرڈر کرنا ہے، تفصیل بھیجیں 😍", "آرڈر کرنا ہے، تفصیل بھیجیں plz"]}, {"id": 15, "share": 4.7, "terms": ["want", "order", "dm"], "topic": "delivery", "purity": 53, "sentiment": {"negative": 53, "positive": 47}, "samples": ["Ordered last week, still waiting.", "Ordered last week, still waiting. pls reply", "I want to order this, DM me 😍"]}, {"id": 2, "share": 4.5, "terms": ["stock", "khatam", "medium"], "topic": "availability", "purity": 58, "sentiment": {"neutral": 100}, "samples": ["Is medium size in stock? 😍", "Stock mein hai ya khatam?", "Is medium size in stock? pls reply"]}, {"id": 3, "share": 4.5, "terms": ["do", "na", "code"], "topic": "discount", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Discount code do na 😍", "Discount code do na plz", "Discount code do na"]}, {"id": 4, "share": 4.5, "terms": ["کوئی", "گی", "رعایت"], "topic": "discount", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["کوئی رعایت ملے گی؟??", "کوئی رعایت ملے گی؟", "کوئی رعایت ملے گی؟ pls reply"]}, {"id": 17, "share": 4.5, "terms": ["lagega", "sale", "kab"], "topic": "discount", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Sale mein kab lagega???", "Sale mein kab lagega? pls reply", "Sale mein kab lagega?"]}, {"id": 19, "share": 4.4, "terms": ["achi", "quality", "kapra"], "topic": "purchase_intent", "purity": 51, "sentiment": {"positive": 51, "neutral": 49}, "samples": ["Mujhe ye lena hai, WhatsApp number? 😍", "Mujhe ye lena hai, WhatsApp number? pls reply", "Kapra kaisa hai, quality achi hai? 😍"]}, {"id": 18, "share": 4.3, "terms": ["fabric", "pure", "cotton"], "topic": "fabric", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Is the fabric pure cotton???", "Fabric thin lag raha hai plz", "Fabric thin lag raha hai??"]}, {"id": 11, "share": 4.2, "terms": ["any", "discount", "suit"], "topic": "discount", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Any discount on this suit? plz", "Any discount on this suit? 😍", "Any discount on this suit? pls reply"]}, {"id": 1, "share": 4.1, "terms": ["khoobsurat", "bohat", "گی"], "topic": "praise", "purity": 100, "sentiment": {"positive": 100}, "samples": ["Bohat khoobsurat hai plz", "Bohat khoobsurat hai", "Bohat khoobsurat hai 😍"]}, {"id": 13, "share": 4.1, "terms": ["dein", "send", "details"], "topic": "purchase_intent", "purity": 57, "sentiment": {"positive": 57, "neutral": 43}, "samples": ["Inbox me details send kar dein", "Size chart bhej dein 😍", "Inbox me details send kar dein??"]}, {"id": 16, "share": 4.1, "terms": ["delivery", "din", "kitne"], "topic": "delivery", "purity": 59, "sentiment": {"negative": 59, "neutral": 41}, "samples": ["Delivery kitne din mein hogi???", "Length kitni hai shirt ki? pls reply", "Length kitni hai shirt ki?"]}, {"id": 0, "share": 3.9, "terms": ["خوبصورت", "بہت", "ہے"], "topic": "praise", "purity": 100, "sentiment": {"positive": 100}, "samples": ["بہت خوبصورت plz", "بہت خوبصورت 😍", "بہت خوبصورت pls reply"]}, {"id": 9, "share": 3.9, "terms": ["very", "beautiful", "dress"], "topic": "praise", "purity": 100, "sentiment": {"positive": 100}, "samples": ["Very beautiful dress!??", "Very beautiful dress!", "Very beautiful dress! 😍"]}, {"id": 8, "share": 3.8, "terms": ["love", "stunning", "colours"], "topic": "praise", "purity": 100, "sentiment": {"positive": 100}, "samples": ["Love the colours, stunning pls reply", "Love the colours, stunning plz", "Love the colours, stunning 😍"]}, {"id": 14, "share": 3.0, "terms": ["karachi", "available", "گی"], "topic": "availability", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Is this available in Karachi? pls reply", "Is this available in Karachi?", "Is this available in Karachi? plz"]}, {"id": 23, "share": 3.0, "terms": ["یہ", "دستیاب", "کیا"], "topic": "availability", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["کیا یہ دستیاب ہے؟ 😍", "کیا یہ دستیاب ہے؟??", "کیا یہ دستیاب ہے؟ plz"]}, {"id": 22, "share": 2.7, "terms": ["pe", "store", "milega"], "topic": "availability", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["Lahore store pe milega?", "Lahore store pe milega???", "Lahore store pe milega? pls reply"]}, {"id": 20, "share": 2.4, "terms": ["tak", "nahi", "abhi"], "topic": "delivery", "purity": 100, "sentiment": {"negative": 100}, "samples": ["Parcel abhi tak nahi aaya 😍", "Parcel abhi tak nahi aaya", "Parcel abhi tak nahi aaya??"]}, {"id": 21, "share": 2.4, "terms": ["کی", "کیسی", "کوالٹی"], "topic": "fabric", "purity": 100, "sentiment": {"neutral": 100}, "samples": ["کپڑے کی کوالٹی کیسی ہے؟ 😍", "کپڑے کی کوالٹی کیسی ہے؟ pls reply", "کپڑے کی کوالٹی کیسی ہے؟ plz"]}], "purity": 86.5, "anomalies": [{"post_id": "P0837", "platform": "TikTok", "content_type": "Styling video", "campaign": "Eid Collection", "eng": 19722, "why": "11.1x the engagement of comparable posts"}, {"post_id": "P1515", "platform": "Instagram", "content_type": "Influencer post", "campaign": "Eid Collection", "eng": 21432, "why": "14.6x the engagement of comparable posts"}, {"post_id": "P0820", "platform": "Instagram", "content_type": "Product photo", "campaign": "11.11 Sale", "eng": 14820, "why": "18.9x the engagement of comparable posts"}, {"post_id": "P0941", "platform": "TikTok", "content_type": "Influencer post", "campaign": "Eid Collection", "eng": 32652, "why": "13.7x the engagement of comparable posts"}, {"post_id": "P2106", "platform": "Instagram", "content_type": "Styling video", "campaign": "12.12 Sale", "eng": 19410, "why": "19.5x the engagement of comparable posts"}, {"post_id": "P1947", "platform": "TikTok", "content_type": "Product photo", "campaign": "12.12 Sale", "eng": 17406, "why": "12.2x the engagement of comparable posts"}, {"post_id": "P0472", "platform": "Instagram", "content_type": "Reel", "campaign": "Summer Lawn", "eng": 11370, "why": "10.0x the engagement of comparable posts"}, {"post_id": "P2148", "platform": "Instagram", "content_type": "Sale announcement", "campaign": "11.11 Sale", "eng": 13698, "why": "15.5x the engagement of comparable posts"}, {"post_id": "P1885", "platform": "Instagram", "content_type": "Product photo", "campaign": "12.12 Sale", "eng": 67, "why": "only 0.1x the engagement of comparable posts"}, {"post_id": "P2395", "platform": "Instagram", "content_type": "Product photo", "campaign": "Eid Collection", "eng": 8814, "why": "11.2x the engagement of comparable posts"}], "n_anom": 120, "recall": 72, "precision": 66, "recs": ["Content: Eid campaign earns the most engagement (median 1,696) and Product photo the least (792). Shift next-campaign budget toward Eid campaign; run a 2-week A/B test against Product photo.", "Promotions: price (20.7%) and discount (17.8%) questions make up 38% of comments. State the price and any bundle/discount in the caption so the team stops answering it comment by comment.", "Customer service: delivery comments are 9.8% of all comments and 36 posts show delivery-complaint spikes. Pin a delivery-time note and send proactive tracking updates during 11.11 / 12.12.", "Product pages: availability (11.2%) and sizing (7.0%) questions suggest adding a city/stock line and a size chart to every lawn-suit post.", "Sales: 9.0% of comments are purchase-intent ('inbox me details'). Set an auto-reply with a WhatsApp/order link and measure how many convert.", "Platform test: Eid Collection posts perform best on median engagement (1,204); repeat that campaign format on TikTok, where engagement multiplier is highest."]};
const f=n=>Math.round(n).toLocaleString('en-US');
const bars=(o,fmt=f)=>{const m=Math.max(...o.map(x=>x[1]));return o.map(x=>`<div class="row"><span>${x[0]}</span><div class="bar" style="width:${Math.max(3,x[1]/m*100)}%"></div><span>${fmt(x[1])}</span></div>`).join('')};
const T={
"1 Content":()=>`<h2>Which content attracts attention?</h2><div class="sub">Median engagement per post (likes + 2×comments + 3×shares)</div>${bars(D.content.map(c=>[c.content_type,c.median_eng]))}
<h2>By campaign</h2>${bars(Object.entries(D.campaigns))}
<h2>Platform × content type</h2><div class="scroll"><table><tr><th></th>${Object.keys(D.matrix[0]).slice(1).map(k=>`<th>${k}</th>`).join('')}</tr>${D.matrix.map(r=>`<tr>${Object.values(r).map((v,i)=>`<td>${i?f(v):v}</td>`).join('')}</tr>`).join('')}</table></div>`,
"2 Wants":()=>`<h2>What does the audience want?</h2><div class="sub">Share of ${f(D.n_comments)} comments by topic (%)</div>${bars(Object.entries(D.topics),v=>v.toFixed(1)+'%')}
<h2>Language mix</h2>${bars(Object.entries(D.langs))}`,
"3 Unusual":()=>`<h2>Which patterns are unusual?</h2><div class="sub">${D.n_anom} posts flagged by Isolation Forest against comparable posts (same platform + content type). Top 10 shown for review.</div>
${D.anomalies.map(a=>`<div class="card"><span class="tag">${a.post_id}</span>${a.platform} · ${a.content_type} · ${a.campaign}<br><b>${a.why}</b></div>`).join('')}
<div class="sub">Check on simulated data: ${D.recall}% of planted unusual posts found, ${D.precision}% of flags were planted ones.</div>`,
"4 Needs":()=>`<h2>Which audience needs should we address?</h2><div class="sub">K-means on character n-grams (handles Roman Urdu spelling). Topic purity ${D.purity}% on simulated data. Top 10 of ${D.segments.length} groups:</div>
${D.segments.slice(0,10).map(s=>`<div class="card"><span class="tag">${s.topic}</span><b>${s.share}%</b> of comments · key words: ${s.terms.join(', ')}<br><span class="sub">sentiment ${Object.entries(s.sentiment).map(e=>e[0]+' '+e[1]+'%').join(' · ')}</span><br>${s.samples.map(x=>`<q>${x}</q>`).join(' · ')}</div>`).join('')}`,
"5 Actions":()=>`<h2>What should the team do next?</h2><ol>${D.recs.map(r=>`<li>${r}</li>`).join('')}</ol>`};
document.getElementById('meta').textContent=`${f(D.n_posts)} posts · ${f(D.n_comments)} comments · lawn suits`;
const nav=document.getElementById('nav'),out=document.getElementById('out');
const show=k=>{out.innerHTML=T[k]();[...nav.children].forEach(b=>b.classList.toggle('on',b.textContent===k))};
Object.keys(T).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k);nav.appendChild(b)});
show("1 Content");
</script></body></html>
